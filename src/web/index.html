<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>home-jev simulator</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">

    <!-- Tailwind compiles in the page, so there is no CSS build step. -->
    <script src="/vendor/tailwind.js"></script>
    <script type="importmap">
      {
        "imports": {
          "preact": "/vendor/preact/dist/preact.mjs",
          "preact/hooks": "/vendor/preact/hooks/dist/hooks.mjs",
          "preact/jsx-runtime": "/vendor/preact/jsx-runtime/dist/jsxRuntime.mjs"
        }
      }
    </script>

    <style>
      :root {
        color-scheme: light dark;
        --background: #fafaf9;
        --foreground: #1c1917;
        --card: #ffffff;
        --muted: #f5f5f4;
        --muted-foreground: #66605b;
        --border: #e7e5e4;
        --input: #d6d3d1;
        --primary: #1c1917;
        --primary-foreground: #fafaf9;
        --highlight: #f1efec; /* touched by the latest event */
        --ring: #a8a29e;
        --lit: #d97706; /* a light that is on */
        --destructive: #b91c1c;
        --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0f0d0c;
          --foreground: #f5f5f4;
          --card: #1a1716;
          --muted: #24201e;
          --muted-foreground: #a8a29e;
          --border: #2e2a27;
          --input: #44403c;
          --primary: #f5f5f4;
          --primary-foreground: #1c1917;
          --highlight: #2a2623;
          --ring: #78716c;
          --lit: #fbbf24;
          --destructive: #f87171;
        }
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: var(--sans);
      }
    </style>

    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-card: var(--card);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-highlight: var(--highlight);
        --color-ring: var(--ring);
        --color-lit: var(--lit);
        --color-destructive: var(--destructive);
        --font-sans: var(--sans);
        --font-mono: var(--mono);
      }

      @layer base {
        *,
        ::before,
        ::after {
          border-color: var(--border);
        }
        summary {
          list-style: none;
        }
        summary::-webkit-details-marker {
          display: none;
        }
      }

      @keyframes busy-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @layer components {
        .eyebrow {
          @apply text-[11px] font-medium uppercase tracking-[0.08em] text-muted-foreground;
        }

        .card {
          @apply rounded-xl border bg-card shadow-xs;
        }

        .icon {
          width: 14px;
          height: 14px;
          flex: none;
          fill: none;
          stroke: currentColor;
          stroke-width: 1.5;
          stroke-linecap: round;
          stroke-linejoin: round;
        }

        .btn {
          @apply inline-flex h-8 cursor-pointer items-center justify-center gap-1.5 rounded-md px-3 text-[13px] font-medium whitespace-nowrap transition-colors select-none;
        }
        .btn:focus-visible,
        .field:focus-visible,
        summary:focus-visible {
          outline: 2px solid var(--ring);
          outline-offset: 2px;
        }
        .btn:disabled {
          @apply pointer-events-none opacity-50;
        }
        .btn-outline {
          @apply border border-input bg-card hover:bg-highlight;
        }
        .btn-primary {
          @apply bg-primary text-primary-foreground hover:opacity-90;
        }
        .btn[aria-busy="true"] {
          opacity: 1;
        }
        .btn[aria-busy="true"] .icon {
          display: none;
        }
        .btn[aria-busy="true"]::before {
          content: "";
          width: 12px;
          height: 12px;
          border-radius: 9999px;
          border: 1.5px solid currentColor;
          border-right-color: transparent;
          animation: busy-spin 0.6s linear infinite;
        }
        @media (prefers-reduced-motion: reduce) {
          .btn[aria-busy="true"]::before {
            animation: none;
          }
        }

        .field {
          @apply h-8 rounded-md border border-input bg-card px-2.5 text-[13px];
        }

        .pill {
          @apply inline-flex items-center gap-1 rounded-full border border-input px-2 py-0.5 text-[11px] leading-4 font-medium whitespace-nowrap;
        }
        .pill-solid {
          @apply border-primary bg-primary text-primary-foreground;
        }

        /* One accessory in a room. */
        .acc {
          @apply grid grid-cols-[minmax(0,1fr)_auto] gap-x-3 rounded-md border border-transparent px-2.5 py-1.5;
        }
        .acc-changed {
          @apply bg-highlight;
        }
        .acc-unsure {
          @apply border-dashed border-input;
        }
        .acc-name {
          @apply font-mono text-[13px] font-medium;
        }
        .acc-desc {
          @apply text-xs text-muted-foreground;
        }
        .acc-level {
          @apply flex items-center justify-end gap-2 text-[13px];
        }
        .acc-source {
          @apply text-right text-xs text-muted-foreground;
        }

        /* Light level: soft, standard, full. */
        .meter {
          display: inline-flex;
          align-items: center;
          gap: 3px;
        }
        .meter i {
          width: 8px;
          height: 8px;
          border-radius: 9999px;
          border: 1.5px solid var(--input);
        }
        .meter i.on {
          border-color: var(--lit);
          background: var(--lit);
          box-shadow: 0 0 0 2px color-mix(in oklab, var(--lit) 22%, transparent);
        }

        /* One applied change in the timeline. */
        .chg {
          @apply grid grid-cols-[minmax(0,1fr)_auto_4ch] gap-x-3;
        }
        .gap-row {
          @apply bg-muted px-5 py-1.5 text-[11px] text-muted-foreground;
        }
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="i-motion" viewBox="0 0 16 16">
        <circle cx="8" cy="8" r="1.25" fill="currentColor" stroke="none" />
        <path d="M5.2 5.2a4 4 0 0 0 0 5.6M10.8 5.2a4 4 0 0 1 0 5.6" />
        <path d="M3 3a7.1 7.1 0 0 0 0 10M13 3a7.1 7.1 0 0 1 0 10" />
      </symbol>
      <symbol id="i-button" viewBox="0 0 16 16">
        <rect x="3.25" y="1.75" width="9.5" height="12.5" rx="2" />
        <rect x="6.25" y="4.75" width="3.5" height="6.5" rx="1" />
      </symbol>
      <symbol id="i-timer" viewBox="0 0 16 16">
        <circle cx="8" cy="8" r="5.75" />
        <path d="M8 5v3l2 1.5" />
      </symbol>
      <symbol id="i-sleep" viewBox="0 0 16 16">
        <path d="M13 9.5A5.5 5.5 0 1 1 6.5 3a4.6 4.6 0 0 0 6.5 6.5z" />
      </symbol>
      <symbol id="i-wake" viewBox="0 0 16 16">
        <circle cx="8" cy="8" r="2.75" />
        <path d="M8 1.5V3M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.06 1.06M11.54 11.54l1.06 1.06M3.4 12.6l1.06-1.06M11.54 4.46l1.06-1.06" />
      </symbol>
      <symbol id="i-leave" viewBox="0 0 16 16">
        <path d="M6 2.5H3.5v11H6" />
        <path d="M7 8h6.5M11 5.5 13.5 8 11 10.5" />
      </symbol>
      <symbol id="i-arrive" viewBox="0 0 16 16">
        <path d="M10 2.5h2.5v11H10" />
        <path d="M2.5 8H9M6.5 5.5 9 8l-2.5 2.5" />
      </symbol>
      <symbol id="i-blinds-closed" viewBox="0 0 16 16">
        <rect x="2.5" y="2.5" width="11" height="11" rx="1.5" />
        <path d="M2.5 5.5h11M2.5 8h11M2.5 10.5h11" />
      </symbol>
      <symbol id="i-blinds-open" viewBox="0 0 16 16">
        <rect x="2.5" y="2.5" width="11" height="11" rx="1.5" />
        <path d="M2.5 4.5h11M2.5 6.25h11" />
      </symbol>
      <symbol id="i-chevron" viewBox="0 0 16 16">
        <path d="M6 3.5 10.5 8 6 12.5" />
      </symbol>
    </svg>

    <div id="app"></div>
    <script type="module" src="/app/main.js"></script>
  </body>
</html>
